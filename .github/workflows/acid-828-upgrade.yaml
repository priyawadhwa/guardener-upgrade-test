# ACID-828 staging check: Chainguard action pins Guardener upgrade mode
# should move. Each step names the pin form it exercises.
name: acid-828-upgrade

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: sha-release-pin
        uses: chainguard-actions/actions-checkout@77548e6996d4fe6357c1ac4b2e72cba4c9511aa9 # v4.2.2
      - name: tag-release-pin
        uses: chainguard-actions/actions-setup-go@v5.0.0
        with:
          go-version: "1.23"
      - name: tag-floating-pin
        uses: chainguard-actions/actions-checkout@v4
      - name: sha-floating-pin
        uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4
      - name: migrate-ignore-actions-target
        uses: chainguard-actions/actions-setup-node@v5.0.0

  never-runs:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: cooldown-probe
        uses: chainguard-actions/anthropics-claude-code-action@27cc1794ce30aadb6f9937337d8f89d637f5d7d0 # v1.0.261
      - name: branch-ref-left-alone
        uses: chainguard-actions/actions-checkout@main
