# ACID-828 staging check: Chainguard action pins Guardener upgrade mode
# should move. Each step names the pin form it exercises.
name: acid-828-upgrade

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: sha-release-pin
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
      - name: tag-release-pin
        uses: chainguard-actions/actions-setup-go@v7.0.0
        with:
          go-version: "1.23"
      - name: tag-floating-pin
        uses: chainguard-actions/actions-checkout@v6
      - name: sha-floating-pin
        uses: chainguard-actions/actions-checkout@40e53bf063d4f87f0a6e0a83231c09bcfb22bc19 # v6
      - name: migrate-ignore-actions-target
        uses: chainguard-actions/actions-setup-node@v5.0.0

  never-runs:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: cooldown-probe
        uses: chainguard-actions/anthropics-claude-code-action@6208f1b61aac812480595c77b7190d58521e8e8d # v1.0.269
      - name: branch-ref-left-alone
        uses: chainguard-actions/actions-checkout@main
