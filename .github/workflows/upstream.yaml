# Upstream pins, so the migration PR carries migrations next to upgrades.
name: upstream

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
